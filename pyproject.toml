[project]
name = "muse-qc-cell"
version = "0.1.0"
description = "AI quality inspection cell for injection molded parts"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "Stefan Rohringer" }]
urls = { Homepage = "https://github.com/StefanRohringer/muse-qc-cell", Demo = "https://stefanrohringer.github.io/muse-qc-cell/", Video = "https://youtu.be/AedP_7rSauo" }
dependencies = [
    "motorbridge>=0.4.9",
    "numpy>=2.4.6",
    "openai>=3.40.0",
    "opencv-python-headless>=5.0.0.93",
    "pyserial>=3.5",
    "rebotarm-control-py",
]

[tool.uv.sources]
rebotarm-control-py = { path = "../seeed-sdk", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
