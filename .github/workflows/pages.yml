name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/media/**"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site
        run: |
          rm -rf _site
          cp -r site _site
          mkdir -p _site/media
          cp docs/media/*.png _site/media/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
