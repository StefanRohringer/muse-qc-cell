[project]
name = "muse-qc-cell"
version = "0.1.0"
description = "AI quality inspection cell for injection molded parts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "motorbridge>=0.4.9",
    "numpy>=2.4.6",
    "openai>=3.40.0",
    "opencv-python-headless>=5.0.0.93",
    "rebotarm-control-py",
]

[tool.uv.sources]
rebotarm-control-py = { path = "../seeed-sdk", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
